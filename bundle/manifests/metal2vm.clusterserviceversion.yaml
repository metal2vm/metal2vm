      deployments:
      - label:
          app: metal2vm-console-plugin
          app.kubernetes.io/part-of: metal2vm
        name: metal2vm-console-plugin
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: metal2vm-console-plugin
          strategy: {}
          template:
            metadata:
              labels:
                app: metal2vm-console-plugin
            spec:
              containers:
              - image: ghcr.io/metal2vm/metal2vm-console-plugin:v0.1.0
                name: plugin
                ports:
                - containerPort: 9443
                  protocol: TCP
                resources:
                  limits:
                    memory: 128Mi
                  requests:
                    cpu: 10m
                    memory: 50Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                volumeMounts:
                - mountPath: /var/cert
                  name: cert
                  readOnly: true
                - mountPath: /etc/nginx/nginx.conf
                  name: nginx-conf
                  readOnly: true
                  subPath: nginx.conf
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              volumes:
              - name: cert
                secret:
                  defaultMode: 420
                  secretName: metal2vm-console-plugin-cert
              - configMap:
                  defaultMode: 420
                  name: metal2vm-console-plugin
                name: nginx-conf
      - label:
          app.kubernetes.io/managed-by: kustomize
          app.kubernetes.io/name: metal2vm
          control-plane: controller-manager
        name: metal2vm-controller-manager
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: metal2vm
              control-plane: controller-manager
          strategy: {}
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/default-container: manager
              labels:
                app.kubernetes.io/name: metal2vm
                control-plane: controller-manager
            spec:
              containers:
              - args:
                - --metrics-bind-address=:8443
                - --leader-elect
                - --health-probe-bind-address=:8081
                - --live-iso=/var/lib/metal2vm/boot/live.iso
                - --live-tools=/var/lib/metal2vm/boot/live-tools.tar.gz
                - --pxe-dir=/var/lib/metal2vm/boot/pxe
                - --agent-binary=/metal2vm-agent
                command:
                - /manager
                env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: RELATED_IMAGE_TRANSFER
                  value: ghcr.io/metal2vm/metal2vm-transfer:v0.1.0
                image: ghcr.io/metal2vm/metal2vm-operator:v0.1.0
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 20
                name: manager
                ports:
                - containerPort: 8081
                  name: health
                  protocol: TCP
                - containerPort: 9444
                  name: gateway
                  protocol: TCP
                - containerPort: 9445
                  name: boot-http
                  protocol: TCP
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                resources:
                  limits:
                    cpu: "1"
                    memory: 256Mi
                  requests:
                    cpu: 10m
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                volumeMounts:
                - mountPath: /var/lib/metal2vm/boot
                  name: boot
                  readOnly: true
              initContainers:
              - command:
                - cp
                - -R
                - /boot/live.iso
                - /boot/live-tools.tar.gz
                - /boot/pxe
                - /var/lib/metal2vm/boot/
                image: ghcr.io/metal2vm/metal2vm-boot-artifacts:v0.1.0
                name: boot-artifacts
                resources:
                  limits:
                    cpu: 500m
                    memory: 64Mi
                  requests:
                    cpu: 10m
                    memory: 16Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  readOnlyRootFilesystem: true
                volumeMounts:
                - mountPath: /var/lib/metal2vm/boot
                  name: boot
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              serviceAccountName: metal2vm-controller-manager
              terminationGracePeriodSeconds: 10
              volumes:
              - emptyDir:
                  sizeLimit: 4Gi
                name: boot
      permissions:
