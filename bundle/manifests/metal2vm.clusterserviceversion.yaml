    owned:
    - description: P2VConfig is the cluster-wide metal2vm configuration. It must be
        named "cluster".
      displayName: metal2vm Settings
      kind: P2VConfig
      name: p2vconfigs.migration.metal2vm.io
      version: v1alpha1
    - description: P2VMigration migrates one P2VSource to a VirtualMachine.
      displayName: Physical Server Migration
      kind: P2VMigration
      name: p2vmigrations.migration.metal2vm.io
      version: v1alpha1
    - description: P2VSource is a physical server that can be migrated to a VM.
      displayName: Physical Server
      kind: P2VSource
      name: p2vsources.migration.metal2vm.io
      version: v1alpha1
  description: |
    metal2vm moves Linux and Windows servers from bare metal into KubeVirt virtual
    machines, from the OpenShift web console. An admin picks the server, chooses
    what happens to each disk and network card, starts the migration, checks the
    test-booted VM and cuts over. The server's disks are only read, so rolling back
    means powering the server on again.

    **Status: alpha.** Tested end to end on a lab cluster with simulated physical
    servers (RHEL 9, Windows Server 2022); not yet on real hardware.

    ## How it works
    1. The server boots the metal2vm live environment (Fedora CoreOS) through its
       BMC (Redfish virtual media), PXE/iPXE, or a USB stick.
    2. The live agent calls home over HTTPS 443 and exposes the disks read-only.
    3. Disks are copied into block PVCs with nbdcopy and converted in place with
       virt-v2v (virtio drivers, bootloader, network config).
    4. The VM test-boots without network; at cutover the server is powered off and
       the VM starts on its production networks.

    ## After installing
    * Enable the console plugin (Console plugin: Enabled), then use
      **Virtualization → Physical servers**.
    * Requirements: OpenShift Virtualization and a storage class with block-mode
      PVCs. The operator creates the SecurityContextConstraints
      `metal2vm-conversion` for its conversion pods.
    * Disconnected clusters: mirror the images listed under related images
      (`oc-mirror` does this automatically).

    Documentation: https://github.com/metal2vm/metal2vm
