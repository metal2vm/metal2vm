# Minimal, schemaless OpenShift CRDs for envtest only (SCC, console plugin,
# console operator config). The real ones come with OpenShift.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: securitycontextconstraints.security.openshift.io
spec:
  group: security.openshift.io
  scope: Cluster
  names: {kind: SecurityContextConstraints, listKind: SecurityContextConstraintsList, plural: securitycontextconstraints, singular: securitycontextconstraints}
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: consoleplugins.console.openshift.io
spec:
  group: console.openshift.io
  scope: Cluster
  names: {kind: ConsolePlugin, listKind: ConsolePluginList, plural: consoleplugins, singular: consoleplugin}
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: consoles.operator.openshift.io
spec:
  group: operator.openshift.io
  scope: Cluster
  names: {kind: Console, listKind: ConsoleList, plural: consoles, singular: console}
  versions:
  - name: v1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}
