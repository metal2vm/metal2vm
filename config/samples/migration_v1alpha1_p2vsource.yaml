# A Dell/HPE/Lenovo server reachable through its Redfish BMC. osAccess is
# optional and enables a read-only pre-check while the server is still running.
apiVersion: migration.metal2vm.io/v1alpha1
kind: P2VSource
metadata:
  labels:
    app.kubernetes.io/name: metal2vm
    app.kubernetes.io/managed-by: kustomize
  name: web01
spec:
  bmc:
    address: https://10.10.0.21
    credentialsSecretRef:
      name: web01-bmc
  osAccess:
    type: ssh
    address: web01.example.com
    credentialsSecretRef:
      name: web01-ssh
