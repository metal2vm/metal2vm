# This rule is not used by the project metal2vm itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the migration.metal2vm.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: metal2vm
    app.kubernetes.io/managed-by: kustomize
  name: p2vconfig-editor-role
rules:
- apiGroups:
  - migration.metal2vm.io
  resources:
  - p2vconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - migration.metal2vm.io
  resources:
  - p2vconfigs/status
  verbs:
  - get
