    url: https://github.com/metal2vm/metal2vm
  - name: Design
    url: https://github.com/metal2vm/metal2vm/blob/main/docs/DESIGN.md
  maintainers:
  - email: linusali@gmail.com
    name: Mohammed Salih Puthenpurayil
  maturity: alpha
  minKubeVersion: 1.35.0
  provider:
    name: metal2vm project
    url: https://github.com/metal2vm/metal2vm
  version: 0.0.0
