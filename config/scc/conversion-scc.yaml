# Conversion pods run virt-v2v, whose libguestfs appliance uses passt for
# networking. passt sandboxes itself with unshare(2), which the default
# seccomp profile blocks. This SCC is restricted-v2 plus CRI-O's stock
# "unshare" profile (/var/lib/kubelet/seccomp/profiles/unshare.json, shipped
# with the node OS). Same approach as Forklift/MTV.
#
# Cluster-scoped, so it is applied on its own (not through config/default,
# whose namespace transformer would add a namespace).
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: metal2vm-conversion
  labels:
    app.kubernetes.io/name: metal2vm
    app.kubernetes.io/managed-by: kustomize
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: null
defaultAddCapabilities: null
fsGroup:
  type: MustRunAs
priority: null
readOnlyRootFilesystem: false
requiredDropCapabilities:
- ALL
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
seccompProfiles:
- runtime/default
- localhost/profiles/unshare.json
supplementalGroups:
  type: RunAsAny
users: []
groups: []
volumes:
- configMap
- csi
- downwardAPI
- emptyDir
- ephemeral
- persistentVolumeClaim
- projected
- secret
---
# Bound by the operator to the per-namespace "metal2vm-conversion" ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metal2vm-conversion-scc
  labels:
    app.kubernetes.io/name: metal2vm
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups: ["security.openshift.io"]
  resources: ["securitycontextconstraints"]
  resourceNames: ["metal2vm-conversion"]
  verbs: ["use"]
