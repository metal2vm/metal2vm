{{- /* Fixed name and always cluster-scoped: the operator binds conversion
ServiceAccounts to it and makes it the owner of the SCC and ConsolePlugin. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "metal2vm.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: metal2vm-conversion-scc
rules:
- apiGroups:
  - security.openshift.io
  resourceNames:
  - metal2vm-conversion
  resources:
  - securitycontextconstraints
  verbs:
  - use
