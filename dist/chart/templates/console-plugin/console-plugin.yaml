{{- /*
metal2vm console plugin (nginx serving the plugin bundle over TLS with a
service-CA certificate). Hand-written, not generated by kubebuilder: names are
fixed because the operator registers the ConsolePlugin for this Service.
*/ -}}
{{- if .Values.consolePlugin.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: metal2vm-console-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    app: metal2vm-console-plugin
    app.kubernetes.io/part-of: metal2vm
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  nginx.conf: |
    error_log /dev/stdout info;
    events {}
    http {
      access_log /dev/stdout;
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      keepalive_timeout 65;
      server {
        listen 9443 ssl;
        listen [::]:9443 ssl;
        ssl_certificate /var/cert/tls.crt;
        ssl_certificate_key /var/cert/tls.key;
        root /usr/share/nginx/html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metal2vm-console-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    app: metal2vm-console-plugin
    app.kubernetes.io/part-of: metal2vm
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: metal2vm-console-plugin}
  template:
    metadata:
      labels: {app: metal2vm-console-plugin}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.manager.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: plugin
        image: "{{ .Values.consolePlugin.image.repository }}{{ if not (contains "@" .Values.consolePlugin.image.repository) }}:{{ .Values.consolePlugin.image.tag }}{{ end }}"
        imagePullPolicy: {{ .Values.consolePlugin.image.pullPolicy }}
        ports: [{containerPort: 9443, protocol: TCP}]
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        resources:
          {{- toYaml .Values.consolePlugin.resources | nindent 10 }}
        volumeMounts:
        - {name: cert, mountPath: /var/cert, readOnly: true}
        - {name: nginx-conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
      volumes:
      - {name: cert, secret: {secretName: metal2vm-console-plugin-cert, defaultMode: 420}}
      - {name: nginx-conf, configMap: {name: metal2vm-console-plugin, defaultMode: 420}}
---
apiVersion: v1
kind: Service
metadata:
  name: metal2vm-console-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    app: metal2vm-console-plugin
    app.kubernetes.io/part-of: metal2vm
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: metal2vm-console-plugin-cert
spec:
  selector: {app: metal2vm-console-plugin}
  ports: [{name: https, port: 9443, targetPort: 9443, protocol: TCP}]
{{- end }}
