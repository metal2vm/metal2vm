{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: p2vconfigs.migration.metal2vm.io
spec:
  group: migration.metal2vm.io
  names:
    kind: P2VConfig
    listKind: P2VConfigList
    plural: p2vconfigs
    singular: p2vconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.gatewayURL
      name: Gateway
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: P2VConfig is the cluster-wide metal2vm configuration. It must
          be named "cluster".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of P2VConfig
            properties:
              agentTokenTTL:
                default: 24h
                description: agentTokenTTL is how long a live-environment boot token
                  stays valid.
                type: string
              defaultStorageClassName:
                description: defaultStorageClassName for copied disks when a migration
                  does not set one.
                type: string
              gateway:
                properties:
                  bootMediaHTTP:
                    description: |-
                      bootMediaHTTP also serves boot artifacts (ISO, PXE) over plain HTTP,
                      for BMCs and iPXE that cannot use HTTPS. The boot token then crosses the
                      network unencrypted: use it on trusted provisioning networks only. The
                      agent API always stays on HTTPS.
                    type: boolean
                  exposure:
                    default: Route
                    description: exposure of the agent gateway. Route needs only port
                      443 on the ingress VIP.
                    enum:
                    - Route
                    - LoadBalancer
                    - NodePort
                    type: string
                  hostname:
                    description: hostname overrides the generated Route host.
                    type: string
                type: object
              images:
                description: |-
                  images overrides component images, e.g. to point at a mirror registry.
                  Empty fields use the images the operator was released with.
                properties:
                  bootArtifacts:
                    description: bootArtifacts carries the live ISO and PXE artifacts.
                    type: string
                  transfer:
                    description: transfer runs nbdcopy and virt-v2v-in-place (includes
                      virtio-win).
                    type: string
                  virtioWin:
                    description: virtioWin replaces the virtio-win drivers bundled
                      in the transfer image.
                    type: string
                type: object
            type: object
          status:
            description: status defines the observed state of P2VConfig
            properties:
              bootMediaHTTPURL:
                description: bootMediaHTTPURL serves boot artifacts over plain HTTP
                  (bootMediaHTTP).
                type: string
              conditions:
                description: 'conditions: Available, Degraded.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gatewayURL:
                description: gatewayURL is the URL live agents connect to.
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: P2VConfig must be named 'cluster'
          rule: self.metadata.name == 'cluster'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
