                      - Blocker
                      - Warning
                      - Info
                      type: string
                  required:
                  - name
                  - passed
                  - severity
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              startedAt:
                format: date-time
                type: string
              vmName:
                description: vmName is the VirtualMachine created for this migration.
                type: string
            type: object
